description: Every 15 minutes, check each repo for new commits, and make the box's first workspace when it has none.
steps:
  - id: default
    type: default-workspace
  - id: heads
    type: heads
  - id: ingest
    type: foreach
    config:
      items: "{{ heads.ingest }}"
      body:
        id: repository
        type: subflow
        config:
          workflow: ingest
          input:
            url: "{{ $current }}"
