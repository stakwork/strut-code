package: stadeum/code
version: 0.1.0
description: The box's repositories and the workspaces they are grouped in, the Code app where they are set up, a check for new commits every 15 minutes, and the repositories tool for the job agent. It names no forge.
requires:
  # `check` and `add` ask a repository's remote for its head with `git ls-remote`.
  binaries: [git]
job:
  tools: [repositories]
schedules:
  - workflow: check
    trigger: { every: interval, minutes: 15 }
