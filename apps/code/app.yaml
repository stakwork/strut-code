title: Code
description: Make workspaces from your repos. Jamie sets each one up for jobs.
icon: folder-git-2
entry: src/App.tsx
grants:
  workflows: []
  # `repositories` reads the workspaces and what the viewer's forges reach,
  # with the suggested default while the box has none; `workspace` makes
  # one or changes its repositories, `default-workspace` is the suggested
  # one's Set up, `rename` and `delete` the rest. Anyone makes and changes
  # workspaces, each as themselves (steps/_code.ts `refusal`). Strut's
  # `conversation/list { about }` finds the viewer's chat about a workspace,
  # which whatever sets it up starts: right after Set up the app opens Jamie
  # there, and each card links it (src/chat.ts). A strut without `about`
  # (stakwork/strut#858) refuses a package's page, and there is no link.
  # Strut's `node/files` reads what packages keep on a workspace's node,
  # such as its setup (pods' `.pod/`), for each card's files (src/files.ts):
  # read only, and naming no package.
  steps: [stadeum/code/repositories, stadeum/code/workspace, stadeum/code/default-workspace, stadeum/code/rename, stadeum/code/delete, conversation/list, node/files]
  sqlite: false
  automations: []
