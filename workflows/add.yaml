description: Add a repo by its URL.
input:
  url:
    type: string
    description: The repository's https address, such as https://example.com/team/app
steps:
  - id: add
    type: add
    config:
      url: "{{ input.url }}"
  - id: ingest
    type: subflow
    config:
      workflow: ingest
      input:
        url: "{{ add.url }}"
